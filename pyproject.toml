[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "alaira-warden"
version = "0.1.0"
description = "Scaffold for evidence-based vulnerability investigation and remediation."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "langgraph>=1,<2",
  "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
  "semantic-version>=2.10,<3",
  "langgraph-checkpoint-postgres>=3,<4",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/alaira_warden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

