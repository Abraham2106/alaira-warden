name: Scaffold checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: warden_test
          POSTGRES_USER: warden
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warden -d warden_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      WARDEN_TEST_DATABASE_URL: postgresql://warden:test-only@localhost:5432/warden_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.3
          uv sync --frozen
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: JavaScript syntax
        run: node --check src/alaira_warden/static/app.js
      - name: Validate Compose
        env:
          WARDEN_API_TOKEN: ci-placeholder-only
          POSTGRES_PASSWORD: ci-owner-only
          WARDEN_DB_APP_PASSWORD: ci-runtime-only
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose -f compose.yaml -f compose.observability.yaml config --quiet
      - name: Build application image
        env:
          WARDEN_API_TOKEN: ci-placeholder-only
          POSTGRES_PASSWORD: ci-owner-only
          WARDEN_DB_APP_PASSWORD: ci-runtime-only
        run: docker compose build api

