<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f0f0eb">
  <title>ALAIRA Warden</title>
  <link rel="icon" href="/static/assets/alaira-logo.png" type="image/png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Ir al contenido</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <a class="brand" href="#overview" aria-label="ALAIRA Warden, resumen"><img src="/static/assets/alaira-logo.png" alt="" width="34" height="34"><span>ALAIRA<span class="brand-product">Warden</span></span></a>
      <button class="workspace-switch" type="button" data-action="settings"><span class="workspace-avatar">A</span><span>Espacio de trabajo<small>Entorno local</small></span><span class="subtle" aria-hidden="true">⌄</span></button>
      <button class="new-investigation" type="button" data-action="new-case"><span aria-hidden="true">＋</span>Nueva investigación</button>
      <nav id="navigation" aria-label="Secciones"></nav>
      <div class="sidebar-bottom">
        <div class="safety-note"><span class="status-dot"></span><span>Autonomía supervisada<small>Las acciones requieren revisión</small></span></div>
        <button class="profile" type="button" data-action="connect"><span class="profile-avatar">L</span><span>Desarrollo local<small id="profile-status">Sin conexión</small></span><span aria-hidden="true">↗</span></button>
      </div>
    </aside>
    <button class="nav-scrim" id="nav-scrim" type="button" aria-label="Cerrar navegación" data-action="nav-toggle" hidden></button>
    <div class="main-column">
      <header class="topbar">
        <button class="icon-button mobile-menu" type="button" data-action="nav-toggle" aria-label="Abrir navegación" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="breadcrumb"><span>Espacio local</span><span aria-hidden="true">/</span><strong id="breadcrumb-current">Resumen</strong></div>
        <div class="topbar-actions"><button class="icon-button" data-action="help" type="button" aria-label="Ayuda y alcance">?</button><span class="topbar-divider"></span><button class="connection-button" data-action="connect" type="button"><span class="status-dot" id="connection-dot"></span><span id="connection-label">Conectar entorno</span><span aria-hidden="true">⌄</span></button></div>
      </header>
      <main id="main-content" tabindex="-1">
        <div id="environment-message" class="environment-message" hidden></div>
        <div id="view" aria-busy="false"></div>
      </main>
      <footer class="app-footer"><span><span class="mini-mark">A</span> ALAIRA Warden</span><span>Scaffold del MVP <span class="footer-separator">·</span> v0.1.0</span><span id="api-health">Comprobando API…</span></footer>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <noscript><div class="noscript">Activa JavaScript para navegar por Warden. La API está disponible en <a href="/docs">su documentación</a>.</div></noscript>
</body>
</html>
